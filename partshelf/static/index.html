<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>KiCad Component Packager</title><link rel="stylesheet" href="/style.css">
</head>
<body class="library-mode">
  <svg class="svg-definitions" xmlns="http://www.w3.org/2000/svg" aria-hidden="true"><defs>
    <symbol id="i-library" viewBox="0 0 20 20"><path d="M3 3h4v14H3zM9 3h3v14H9zM14 4l3-1 3 13-3 1z"/></symbol>
    <symbol id="i-folder" viewBox="0 0 20 20"><path d="M2 5h6l2 2h8v10H2zM2 5V3h6l2 2h7v2"/></symbol>
    <symbol id="i-import" viewBox="0 0 20 20"><path d="M10 2v10m-4-4 4 4 4-4M3 12v5h14v-5"/></symbol>
    <symbol id="i-export" viewBox="0 0 20 20"><path d="M10 12V2M6 6l4-4 4 4M3 12v5h14v-5"/></symbol>
    <symbol id="i-refresh" viewBox="0 0 20 20"><path d="M16 7a6.5 6.5 0 1 0 .4 5M16 2v5h-5"/></symbol>
    <symbol id="i-project" viewBox="0 0 20 20"><rect x="3" y="3" width="14" height="14" rx="1"/><path d="M6 7h4v6h4M10 10h4M6 5v4M14 8v4M14 11v4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 20 20"><path d="M4 5h12M7 5V3h6v2M5 5l1 12h8l1-12M8 8v6M12 8v6"/></symbol>
    <symbol id="i-clock" viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><path d="M10 5v5l3 2"/></symbol>
    <symbol id="i-search" viewBox="0 0 20 20"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 4 4"/></symbol>
    <symbol id="i-component" viewBox="0 0 20 20"><rect x="5" y="5" width="10" height="10" rx="1"/><path d="M2 7h3M2 10h3M2 13h3M15 7h3M15 10h3M15 13h3M7 2v3M10 2v3M13 2v3M7 15v3M10 15v3M13 15v3"/></symbol>
    <symbol id="i-check" viewBox="0 0 20 20"><path d="m4 10 4 4 8-8"/></symbol>
  </defs></svg>
  <header class="toolbar" aria-label="Workspace toolbar">
    <div class="app-name" aria-label="KiCad Component Packager"><svg class="ui-icon" aria-hidden="true"><use href="#i-component"/></svg><strong>KiCad <span>Component Packager</span></strong></div>
    <div class="toolbar-group">
      <button class="tool-button" id="import-button" title="Import components (⌘/Ctrl+I)"><svg class="ui-icon"><use href="#i-import"/></svg>Import…</button>
      <button class="tool-button" id="export-all" title="Export a library ZIP for KiCad PCM or Packager (⌘/Ctrl+S)"><svg class="ui-icon"><use href="#i-export"/></svg>Export ZIP…</button>
      <button class="tool-button icon-only" id="refresh-button" title="Refresh workspace" aria-label="Refresh workspace"><svg class="ui-icon"><use href="#i-refresh"/></svg></button>
    </div>
    <div class="toolbar-spacer"></div><span class="toolbar-label project-only">Install target</span>
    <button id="project-picker" class="project-picker project-only"><svg class="ui-icon"><use href="#i-project"/></svg><span id="active-project">Open project…</span><span class="chevron">⌄</span></button>
  </header>
  <div class="workspace">
    <aside class="sidebar" aria-label="Library browser">
      <div class="sidebar-heading project-heading-row project-only">Open projects<button class="text-button" data-project-picker aria-label="Add project to workspace">+</button></div>
      <nav id="open-projects" class="project-only" aria-label="Open projects"></nav>
      <div class="sidebar-heading">Catalog</div>
      <nav aria-label="Library navigation">
        <button class="nav-item active" data-view="catalog" data-scope="all"><svg class="ui-icon"><use href="#i-library"/></svg><span>All components</span><span id="nav-count" class="nav-count">0</span></button>
        <button class="nav-item project-only" data-view="catalog" data-scope="installed"><svg class="ui-icon"><use href="#i-check"/></svg><span>In this project</span><span id="installed-count" class="nav-count">0</span></button>
        <button class="nav-item project-only" data-view="catalog" data-scope="updates"><svg class="ui-icon"><use href="#i-refresh"/></svg><span>Updates available</span><span id="update-count" class="nav-count">0</span></button>
      </nav>
      <button class="nav-item" id="recently-deleted"><svg class="ui-icon"><use href="#i-trash"/></svg><span>Recently deleted</span></button>
      <div class="sidebar-heading library-heading" id="library-root-drop" title="Drop a library here to move it to the top level">Libraries<button class="text-button" id="new-library" aria-label="Create library">+</button></div><nav id="category-tree" aria-label="Library folders"></nav>
      <div class="sidebar-heading">Tools</div>
      <nav aria-label="Tools"><button class="nav-item project-only" id="library-mode"><span>← Back to library packaging</span></button>
        <button class="nav-item project-only" data-view="project"><svg class="ui-icon"><use href="#i-project"/></svg><span>Project libraries</span></button>
        <button class="nav-item" data-view="activity"><svg class="ui-icon"><use href="#i-clock"/></svg><span>Activity log</span></button>
      </nav>
      <div class="sidebar-bottom"><span class="status-dot"></span>Local catalog<div id="catalog-location" class="path-label"></div></div>
    </aside>
    <main id="main">
      <div class="project-tab-bar project-only"><div id="project-tabs" role="tablist" aria-label="Open projects"></div><button class="project-add" data-project-picker title="Add project to workspace" aria-label="Add project to workspace">+</button></div>
      <section id="catalog-view" class="catalog-layout" aria-label="Component library">
        <div class="table-pane">
          <div class="panel-heading"><h1 id="view-label">All components</h1><span id="catalog-count" class="count-label"></span></div>
          <div class="asset-filters"><label><input type="checkbox" id="has-footprint"> Has footprint</label><label><input type="checkbox" id="has-model"> Has 3D model</label></div><div class="filters"><label class="search"><svg class="ui-icon"><use href="#i-search"/></svg><input id="search" type="search" placeholder="Search components" aria-label="Search components"><kbd>⌘ F</kbd></label><select class="project-only" id="status-filter" aria-label="Filter components"><option value="all">All parts</option><option value="installed">In project</option><option value="updates">Updates available</option></select></div>
          <div id="selection-bar" class="selection-bar" hidden><strong id="selection-count"></strong><button class="button small" id="move-selection">Move to library…</button><button class="button small" id="edit-selection">Edit properties…</button><button class="button small" id="delete-selection">Delete selected…</button><button class="text-button" id="clear-selection">Clear</button></div><div id="catalog" class="table-scroll"></div><div class="pane-status" id="selection-status">Select a component to inspect its assets.</div>
        </div>
        <div id="inspector-divider" class="pane-divider" role="separator" tabindex="0" aria-label="Resize component inspector" aria-orientation="vertical" aria-valuemin="280" aria-valuemax="560" aria-valuenow="350"></div>
        <aside id="inspector" class="inspector" aria-label="Component inspector"></aside>
      </section>
      <section id="project-view" class="document-view" hidden></section><section id="activity-view" class="document-view" hidden></section>
    </main>
  </div>
  <footer class="statusbar"><span id="workspace-status"><span class="status-dot"></span>Ready</span><span id="status-counts"></span><span class="statusbar-spacer"></span><span id="kicad-state">Checking KiCad…</span><span class="version">Version 0.1.11</span></footer>
  <dialog id="modal" aria-labelledby="modal-title"><div class="modal-header"><h2 id="modal-title"></h2><button class="icon-button" id="close-modal" aria-label="Close dialog">×</button></div><div id="modal-body"></div></dialog>
  <div id="toast" role="status" aria-live="polite" hidden></div><script src="/model-viewport.js" defer></script><script src="/diagram-viewer.js" defer></script><script src="/library-moves.js" defer></script><script src="/component-tools.js" defer></script><script src="/import-progress.js" defer></script><script src="/app.js" defer></script>
</body></html>
